<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="3;url=https://spartanshub.spartanrobotics.org" />
  <title>We've moved - Spartan Robotics</title>
  <link rel="icon" sizes="512x512" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0a0a0a" />
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
    }

    .card {
      max-width: 32rem;
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      margin: 0 0 1rem 0;
    }

    p {
      line-height: 1.6;
      margin: 0 0 1rem 0;
      color: #c9c9c9;
    }

    a {
      color: #4da3ff;
    }

    .redirect-note {
      font-size: 0.85rem;
      color: #888;
    }

    .button {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      background: #4da3ff;
      color: #0a0a0a;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>This site has moved</h1>
    <p>
      Spartan Robotics' team hub is now at
      <a href="https://spartanshub.spartanrobotics.org">spartanshub.spartanrobotics.org</a>.
    </p>
    <p class="redirect-note">Redirecting you there automatically...</p>
    <a class="button" href="https://spartanshub.spartanrobotics.org">Go to Spartans Hub</a>
  </div>

  <script>
    setTimeout(function () {
      window.location.replace('https://spartanshub.spartanrobotics.org');
    }, 3000);
  </script>
</body>
</html>
