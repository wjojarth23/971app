substitutions:
  _REGION: us-west1
  _SERVICE_NAME: spartanshub
  _AR_REPO: spartanshub

steps:
  # Build the app image. PUBLIC_* build args are baked into the client
  # bundle at build time — see Dockerfile comment. Non-secret, so passing
  # them as substitutions here is fine; keep real secrets out of this file.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '--build-arg=PUBLIC_SUPABASE_URL=${_PUBLIC_SUPABASE_URL}'
      - '--build-arg=PUBLIC_SUPABASE_ANON_KEY=${_PUBLIC_SUPABASE_ANON_KEY}'
      - '--build-arg=PUBLIC_SENTRY_DSN=${_PUBLIC_SENTRY_DSN}'
      - '--build-arg=PUBLIC_ONSHAPE_ACCESS_KEY=${_PUBLIC_ONSHAPE_ACCESS_KEY}'
      - '--build-arg=PUBLIC_ONSHAPE_SECRET_KEY=${_PUBLIC_ONSHAPE_SECRET_KEY}'
      - '--build-arg=PUBLIC_ONSHAPE_BASE_URL=${_PUBLIC_ONSHAPE_BASE_URL}'
      - '--build-arg=PUBLIC_AUTOCAM_API_URL=${_PUBLIC_AUTOCAM_API_URL}'
      - '--build-arg=PUBLIC_APP_ORIGIN=${_PUBLIC_APP_ORIGIN}'
      - '--build-arg=PUBLIC_SITE_URL=${_PUBLIC_SITE_URL}'
      - '--build-arg=PUBLIC_ROUTES=${_PUBLIC_ROUTES}'
      - '--build-arg=PUBLIC_TBA_API_KEY=${_PUBLIC_TBA_API_KEY}'
      - '--build-arg=PUBLIC_AUTO_VENDOR=${_PUBLIC_AUTO_VENDOR}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest'
      - .

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}'

  # Deploy. Secret Manager-backed vars are wired via --set-secrets (set once
  # on the Cloud Run service outside this file, or add --set-secrets here if
  # you want every deploy to declare them explicitly); plain PUBLIC_* runtime
  # values that don't need to be baked into the bundle can go in --set-env-vars.
  - name: 'gcr.io/google-cloud-sdk/slim'
    args:
      - gcloud
      - run
      - deploy
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
